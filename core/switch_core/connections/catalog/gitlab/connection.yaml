slug: gitlab
name: GitLab
category: Source control
description: Read and update GitLab projects, issues, merge requests and pipelines, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  # GitLab OAuth access tokens expire after 2 hours (7200 seconds) with rotating refresh tokens.
  refresh: rotating
  oauth:
    # GitLab.com supports Dynamic Client Registration (RFC 7591):
    # Core dynamically registers an OAuth client on first connect.
    registration: dynamic
    # GitLab redirects back to loopback ports on the desktop running Switch Console.
    redirect: [loopback]
    loopback_ports: [39231, 39232, 39233, 39234, 39235]
    prompt: consent
    revocation_discovered: true
  identity:
    # Account identity resolution using the standard token info endpoint
    # (https://gitlab.com/oauth/token/info), which requires no extra scope beyond mcp.
    url: https://gitlab.com/oauth/token/info
    account_id: resource_owner_id
    label: resource_owner_id
# GitLab access tokens expire after 2 hours (7200 seconds).
token: { kind: pass_through, max_lifetime: 7200 }
mcp:
  servers:
    # GitLab's official remote MCP server.
    - { name: gitlab, url: "https://gitlab.com/api/v4/mcp" }
access:
  read:
    scopes:
      - mcp
  write:
    scopes:
      - mcp
tools: { mode: pass_through }
