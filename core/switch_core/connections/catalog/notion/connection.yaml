slug: notion
name: Notion
category: Knowledge base
description: Read and write Notion pages and databases, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  refresh: rotating
  oauth:
    # Notion's remote MCP server at mcp.notion.com offers dynamic client
    # registration (RFC 7591) via its discovery document.
    registration: dynamic
    redirect: [loopback]
    loopback_ports: [39231, 39232, 39233, 39234, 39235]
    prompt: consent
    revocation_discovered: true
  identity:
    url: https://api.notion.com/v1/users/me
    account_id: id
    label: name
token: { kind: pass_through, max_lifetime: 86400 }
mcp:
  servers:
    - { name: notion, url: "https://mcp.notion.com/mcp" }
access:
  read:
    scopes:
      - default
  write:
    scopes:
      - default
tools: { mode: pass_through }
